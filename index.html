<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traini — Setup Test</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e8eaed;
  }
  main {
    max-width: 34rem;
    padding: 2.5rem;
    text-align: center;
  }
  .badge {
    display: inline-block;
    padding: 0.3rem 0.75rem;
    border-radius: 999px;
    background: #103d2b;
    color: #5ee9a0;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  h1 { font-size: 2.25rem; margin: 1.25rem 0 0.5rem; }
  p { line-height: 1.6; color: #a9b0bb; margin: 0.5rem 0; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #1b1f27;
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    color: #cfd6e0;
  }
  footer { margin-top: 2rem; font-size: 0.85rem; color: #6c7482; }
</style>
</head>
<body>
<main>
  <span class="badge">Deploy OK</span>
  <h1>Traini</h1>
  <p>GitHub Pages is publishing from the <code>main</code> branch.</p>
  <p>This is a placeholder test page. Real content comes next.</p>
  <footer>
    <span id="built"></span>
  </footer>
</main>
<script>
  document.getElementById("built").textContent =
    "Page loaded " + new Date().toISOString();
</script>
</body>
</html>
